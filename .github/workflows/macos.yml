name: macOS app

on:
  push:
    branches: [main]
    paths:
      - 'platforms/apple/**'
      - 'platforms/windows/src/engine/src/apple/**'
      - 'shared/ipc-schema/**'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - 'shared/scripts/conformance.py'
      - 'shared/test-corpus/conformance/**'
      - 'shared/scripts/check_catalog_index_jobs.py'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'platforms/apple/**'
      - 'platforms/windows/src/engine/src/apple/**'
      - 'shared/ipc-schema/**'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - 'shared/scripts/conformance.py'
      - 'shared/test-corpus/conformance/**'
      - 'shared/scripts/check_catalog_index_jobs.py'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build app + shared engine (SwiftPM, Cargo)
    runs-on: macos-26
    timeout-minutes: 90

    defaults:
      run:
        working-directory: platforms/apple

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        # MLX Swift 0.32.3 requires Swift tools 6.3; Xcode 26.6 supplies Swift 6.3.
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Swift toolchain info
        run: swift --version

      - name: Cache SwiftPM
        # Cache only the dependency DOWNLOAD cache (resolved package sources +
        # binary artifacts), NOT the project build products. Caching
        # `platforms/apple/.build` (compiled .o/.swiftmodule) keyed only on
        # Package.resolved + a broad restore-keys fallback restored STALE compiled
        # objects whenever engine SOURCE changed but deps didn't — so `swift test`
        # silently ran pre-change code (a non-deterministic CI that passed/failed
        # by which objects survived). org.swift.swiftpm keeps dep downloads cached
        # (no re-fetch); everything compiles fresh, so the test always reflects HEAD.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('platforms/apple/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve packages
        run: swift package resolve

      # The Swift engine is not shipped: it is built as the conformance peer
      # (and for its own tests) only.
      - name: Build Swift engine (conformance peer, release)
        run: swift build -c release --product FileIDEngine

      - name: Build app (release)
        run: swift build -c release --product FileID

      # Conformance-only Swift engine with the test Trash root (compile-time
      # condition, never shipped; assemble_app.sh refuses it), so the Trash
      # round trip runs with the Swift engine as the trashing side too.
      - name: Build Swift engine with the test Trash root (conformance only)
        run: |
          swift build -c release -Xswiftc -DFILEID_TEST_TRASH_ROOT --product FileIDEngine
          cp .build/release/FileIDEngine "$RUNNER_TEMP/FileIDEngine-swift-test-trash"

      - name: Build App Store sandbox variant (app)
        run: swift build -c release -Xswiftc -DFILEID_APP_STORE --product FileID

      # The Rust engine as the Mac app hosts it (Contents/MacOS/fileidd):
      # Apple adapters linked, events on fd 2, Swift-engine state root. Built
      # with test-trash-root (implies apple-adapters; test builds only) so the
      # Trash round trip runs against a per-case folder, never the Trash.
      - name: Build Rust engine with Apple adapters
        run: |
          set -euo pipefail
          swift build -c release --product FileIDAppleKit
          KIT_DIR="$PWD/.build/release"
          (cd ../windows/src/engine && LIBRARY_PATH="$KIT_DIR" LIBONNXRUNTIME_NO_PKG_CONFIG=1 cargo build --locked --jobs 4 --features test-trash-root --target-dir "$RUNNER_TEMP/fileid-conformance-engine-apple")
          ENGINE="$RUNNER_TEMP/fileid-conformance-engine-apple/debug/FileIDEngine"
          cp "$KIT_DIR/libFileIDAppleKit.dylib" "$(dirname "$ENGINE")/"
          install_name_tool -add_rpath @executable_path "$ENGINE"

      - name: Build tests
        # Compile the test targets outside the 12-minute run cap below: with
        # FileIDImaging, FileIDVLMCore, FileIDModelInfo and FileIDAppleKit the
        # debug test build alone takes ~9-10 min on hosted runners.
        run: swift build --build-tests

      - name: Run tests
        # Swift Testing framework. SharedTests + EngineTests. Corpus tests
        # that need a populated Tests/Corpus/ tree skip themselves when the
        # corpus isn't present (it's downloaded via scripts/build_corpus.sh
        # locally and is too slow/fragile to fetch in CI).
        #
        # 12-minute hard cap (healthy runs finish in ~3): a leaked child
        # process holding the test harness's output pipe once turned a
        # finished suite into a 60-minute silent hang that ate the whole
        # job timeout. On expiry, surface which processes were still
        # alive, then fail fast.
        run: |
          set -uo pipefail
          # perl's alarm survives exec, and perl is always on the runner
          # (coreutils timeout/gtimeout is not). SIGALRM kills the test
          # process tree's leader at 12 min → exit 142.
          #
          # Capture swift test's REAL exit code: the previous
          # `if ! cmd; then status=$?` form captured the status of the negated
          # condition (always 0 when the `then` runs), so a failing OR
          # non-compiling test suite was reported as exit 0 and the job went
          # green — the macOS test gate silently never failed (a stale
          # non-compiling test target rode green for weeks). Run directly,
          # capture $? immediately, then branch.
          # `--no-parallel`: several engine tests read an IPCSink pipe with a
          # BLOCKING `availableData` read on a Task (cooperative-pool thread).
          # Run in parallel across suites, enough of those park pool threads at
          # once to starve the executor and intermittently wedge the
          # swift-testing harness to the 12-min SIGALRM (a flaky exit 142 that
          # the old masked gate hid). Serial execution runs at most one such
          # reader at a time, so the pool can't be starved. The tests are small
          # and fast; serial adds only seconds. (The blocking-read pattern is
          # also being removed in the tests themselves.)
          set +e
          # The query-reply test starts the shared engine as the app hosts it
          # (FILEID_TEST_HOSTED_ENGINE_PATH, libFileIDAppleKit beside it). The Swift
          # media tests re-exec FILEID_TEST_ENGINE_PATH as their worker with the Swift
          # argv protocol, so it must stay the Swift release engine; the scan-cancel
          # test scans a temporary folder with the Swift debug peer.
          FILEID_TEST_SCAN_ENGINE_PATH="$PWD/.build/debug/FileIDEngine" FILEID_TEST_ENGINE_PATH="$PWD/.build/release/FileIDEngine" FILEID_TEST_HOSTED_ENGINE_PATH="$RUNNER_TEMP/fileid-conformance-engine-apple/debug/FileIDEngine" perl -e 'alarm 720; exec @ARGV or die "exec: $!"' swift test --skip-build --no-parallel
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::swift test exited $status (142 = 12-min SIGALRM timeout)"
            echo "--- surviving processes ---"
            ps ax -o pid,ppid,etime,command | grep -E "FileID|swiftpm" | grep -v grep || true
            exit "$status"
          fi

      - name: Build Rust engine for conformance
        working-directory: platforms/windows/src/engine
        run: cargo build --locked --jobs 4 --target-dir "$RUNNER_TEMP/fileid-conformance-engine"

      # Shared engine conformance suite (shared/test-corpus/conformance): the
      # Swift engine with the Rust engine as peer for the cross-engine cases,
      # then the Rust engine with the Swift engine as peer for the cross-engine
      # cases that start on Rust. Known divergences are tracked per case and
      # fail the run when they stop reproducing.
      - name: Engine conformance — Swift
        timeout-minutes: 15
        run: python3 "$GITHUB_WORKSPACE/shared/scripts/conformance.py" --engine "$RUNNER_TEMP/FileIDEngine-swift-test-trash" --test-trash-root --peer-engine "$RUNNER_TEMP/fileid-conformance-engine/debug/FileIDEngine"

      - name: Engine conformance — Rust
        timeout-minutes: 15
        run: python3 "$GITHUB_WORKSPACE/shared/scripts/conformance.py" --engine "$RUNNER_TEMP/fileid-conformance-engine/debug/FileIDEngine" --peer-engine "$RUNNER_TEMP/FileIDEngine-swift-test-trash"

      - name: Engine conformance — Rust (app-hosted adapters build)
        timeout-minutes: 15
        run: python3 "$GITHUB_WORKSPACE/shared/scripts/conformance.py" --engine "$RUNNER_TEMP/fileid-conformance-engine-apple/debug/FileIDEngine" --flavor rust --test-trash-root --peer-engine "$RUNNER_TEMP/FileIDEngine-swift-test-trash"

      - name: Verify catalog index recovery
        run: python3 "$GITHUB_WORKSPACE/shared/scripts/check_catalog_index_jobs.py" --engine "$PWD/.build/release/FileIDEngine"

      # The shipped layout: the app plus the one engine, assembled the way
      # release.sh and testflight.sh do (App Store variant, unsigned), with the
      # release Rust engine and no ONNX Runtime (runners do not have the pinned
      # dylib; its absence only stops the ONNX models, not startup).
      - name: Assemble the app bundle (fileidd only)
        timeout-minutes: 45
        run: |
          set -euo pipefail
          FILEID_APP_STORE=1 FILEID_BUILD_CONFIGURATION=release bash scripts/assemble_app.sh "$RUNNER_TEMP/FileID.app" 0.0.0 1
          CONTENTS="$RUNNER_TEMP/FileID.app/Contents"
          for bin in "$CONTENTS/MacOS/FileID" "$CONTENTS/MacOS/fileidd" "$CONTENTS/Frameworks/libFileIDAppleKit.dylib"; do
            if [[ ! -e "$bin" ]]; then
              echo "::error::Missing in the bundle: $bin"
              exit 1
            fi
            echo "$bin OK ($(du -m "$bin" | cut -f1) MB)"
          done
          if [[ -e "$CONTENTS/MacOS/FileIDEngine" ]]; then
            echo "::error::A Swift engine binary is in the bundle; only fileidd ships."
            exit 1
          fi

      # Smoke: the bundled engine starts and says ready. IPC events go to
      # stderr in the app-hosted build; stdin EOF is its shutdown.
      - name: Smoke — bundled engine startup
        run: |
          set -euo pipefail
          ENGINE="$RUNNER_TEMP/FileID.app/Contents/MacOS/fileidd"
          export HOME="$RUNNER_TEMP/smoke-home" CFFIXED_USER_HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$HOME"
          : | "$ENGINE" > engine.stdout 2> engine.stderr &
          ENGINE_PID=$!
          BUDGET=30
          for i in $(seq 1 $BUDGET); do
            if ! kill -0 $ENGINE_PID 2>/dev/null; then
              echo "Engine exited after ${i}s"
              break
            fi
            sleep 1
          done
          echo "----- engine.stderr (size $(wc -c < engine.stderr) bytes) -----"
          cat engine.stderr || true
          echo "----- end -----"
          if kill -0 $ENGINE_PID 2>/dev/null; then
            kill -9 $ENGINE_PID || true
            echo "::error::fileidd did not exit within ${BUDGET}s of stdin EOF."
            exit 1
          fi
          if ! grep -q '"ready"' engine.stderr; then
            echo "::error::engine.stderr did not contain a ready event."
            exit 1
          fi
          echo "Bundled engine startup smoke passed. ✅"

      # Privacy gate parity with Windows: source URL allowlist. Scans
      # every .swift under platforms/apple/ for any https?:// URL and
      # asserts every host is on the allowlist. Stops a contributor
      # from silently adding a new download / telemetry / analytics
      # endpoint even one that doesn't match the existing deny-list.
      # MUST stay in sync with the Windows equivalent in windows-engine.yml.
      - name: Privacy — source URL allowlist scan
        run: |
          set -euo pipefail
          # Allowlist: same hosts as Windows. github.com appears in
          # Package.swift for SwiftPM deps; huggingface.co for model
          # downloads at runtime.
          allowed=(
            "huggingface.co"
            "github.com"
            "developer.download.nvidia.com"
            "developer.nvidia.com"
            "docs.nvidia.com"
            "schemas.microsoft.com"
            "schemas.openxmlformats.org"
            "ai.google.dev"
            # Build time only: SwiftPM fetches the pinned ONNX Runtime
            # archive (checksum-locked) named in the vendored package's
            # Package.swift. Nothing at runtime talks to this host.
            "download.onnxruntime.ai"
          )
          hits=()
          # Find all .swift under apple/, excluding .build/ + DerivedData.
          # Anchor on "(http|https)://([a-zA-Z0-9._-]+)" — group 2 is the host.
          while IFS= read -r line; do
            file="${line%%:*}"
            url="${line#*:}"
            host=$(echo "$url" | sed -E 's|^https?://([a-zA-Z0-9._-]+).*|\1|' | tr '[:upper:]' '[:lower:]')
            allowed_match=0
            for a in "${allowed[@]}"; do
              if [ "$host" = "$a" ]; then
                allowed_match=1
                break
              fi
            done
            if [ "$allowed_match" -eq 0 ]; then
              hits+=("$file: $url")
            fi
          done < <(find . -name '*.swift' -not -path '*/.build/*' -not -path '*/DerivedData/*' \
            -exec grep -oHE 'https?://[a-zA-Z0-9._/-]+' {} \;)
          if (( ${#hits[@]} > 0 )); then
            printf '::error::URLs found that are not on the allowlist:\n'
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          echo "All Swift source URLs are on the allowlist. ✅"

      - name: Privacy — telemetry-string scan
        run: |
          set -euo pipefail
          # The shipped app and its shared modules link no ONNX Runtime.
          for bin in "$RUNNER_TEMP/FileID.app/Contents/MacOS/FileID" "$RUNNER_TEMP/FileID.app/Contents/Frameworks/libFileIDAppleKit.dylib"; do
            if [[ -n "$(otool -L "$bin" | grep -i onnxruntime || true)" || -n "$(nm -a "$bin" 2>/dev/null | grep -E 'OrtGetApiBase|OnnxRuntimeBindings|FileIDORT' || true)" ]]; then
              echo "::error::$bin links ONNX Runtime"; exit 1
            fi
          done
          # The ONNX Runtime framework the retired Swift engine (test peer, not
          # shipped) links, scanned on its own so an onnxruntime package update
          # that adds Microsoft's uploader still fails here.
          ort=.build/artifacts/onnxruntime-swift-package-manager/onnxruntime/onnxruntime.xcframework/macos-arm64_x86_64/onnxruntime.framework/Versions/A/onnxruntime
          CONTENTS="$RUNNER_TEMP/FileID.app/Contents"
          python3 "$GITHUB_WORKSPACE/shared/scripts/check_binary_privacy.py" "$CONTENTS/MacOS/FileID" "$CONTENTS/MacOS/fileidd" "$CONTENTS/Frameworks/libFileIDAppleKit.dylib" "$ort"
          echo "No telemetry strings detected. ✅"
