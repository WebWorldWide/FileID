name: macOS app

on:
  push:
    branches: [main]
    paths:
      - 'platforms/apple/**'
      - 'platforms/windows/src/engine/src/apple/**'
      - 'shared/ipc-schema/**'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - 'shared/scripts/conformance.py'
      - 'shared/test-corpus/conformance/**'
      - 'shared/scripts/check_catalog_index_jobs.py'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'platforms/apple/**'
      - 'platforms/windows/src/engine/src/apple/**'
      - 'shared/ipc-schema/**'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - 'shared/scripts/conformance.py'
      - 'shared/test-corpus/conformance/**'
      - 'shared/scripts/check_catalog_index_jobs.py'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build app + shared engine (SwiftPM, Cargo)
    runs-on: macos-26
    timeout-minutes: 150

    defaults:
      run:
        working-directory: platforms/apple

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        # MLX Swift 0.32.3 requires Swift tools 6.3; Xcode 26.6 supplies Swift 6.3.
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Swift toolchain info
        run: swift --version

      - name: Cache SwiftPM
        # Caches dependency downloads only. Caching .build restored stale objects, so tests ran old code.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('platforms/apple/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve packages
        run: swift package resolve

      - name: Build app (release)
        run: swift build -c release --product FileID

      - name: Build App Store sandbox variant (app)
        run: swift build -c release -Xswiftc -DFILEID_APP_STORE --product FileID

      # The engine as the Mac app hosts it (Contents/MacOS/fileidd). test-trash-root implies
      # apple-adapters and keeps the Trash round trip in a per-case folder, never the real Trash.
      - name: Build Rust engine with Apple adapters
        run: |
          set -euo pipefail
          swift build -c release --product FileIDAppleKit
          KIT_DIR="$PWD/.build/release"
          (cd ../windows/src/engine && LIBRARY_PATH="$KIT_DIR" cargo build --locked --jobs 4 --features test-trash-root --target-dir "$RUNNER_TEMP/fileid-conformance-engine-apple")
          ENGINE="$RUNNER_TEMP/fileid-conformance-engine-apple/debug/FileIDEngine"
          cp "$KIT_DIR/libFileIDAppleKit.dylib" "$(dirname "$ENGINE")/"
          install_name_tool -add_rpath @executable_path "$ENGINE"

      - name: Build tests
        # Compiled outside the 12-minute run cap below; the debug test build alone takes 9-10 minutes.
        run: swift build --build-tests

      - name: Run tests
        # Corpus tests skip themselves when Tests/Corpus/ is absent. 12-minute hard cap: a leaked
        # child holding the harness's output pipe can hang a finished suite; on expiry, list the survivors.
        run: |
          set -uo pipefail
          # perl's alarm survives exec and perl is always on the runner (coreutils timeout is not);
          # SIGALRM ends the run at 12 minutes with exit 142.
          # Read $? right after the command: `if ! cmd; then status=$?` would capture the negation.
          # `--no-parallel`: suites that spawn the real engine must not starve each other's threads.
          set +e
          # The query-reply test starts the engine as the app hosts it, with libFileIDAppleKit beside it.
          FILEID_TEST_HOSTED_ENGINE_PATH="$RUNNER_TEMP/fileid-conformance-engine-apple/debug/FileIDEngine" perl -e 'alarm 720; exec @ARGV or die "exec: $!"' swift test --skip-build --no-parallel
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::swift test exited $status (142 = 12-min SIGALRM timeout)"
            echo "--- surviving processes ---"
            ps ax -o pid,ppid,etime,command | grep -E "FileID|swiftpm" | grep -v grep || true
            exit "$status"
          fi

      - name: Build Rust engine for conformance
        working-directory: platforms/windows/src/engine
        run: cargo build --locked --jobs 4 --target-dir "$RUNNER_TEMP/fileid-conformance-engine"

      # Conformance runs against the plain engine and the build the Mac app hosts.
      # Known divergences are tracked per case and fail the run when they stop reproducing.
      - name: Engine conformance — Rust
        timeout-minutes: 15
        run: python3 "$GITHUB_WORKSPACE/shared/scripts/conformance.py" --engine "$RUNNER_TEMP/fileid-conformance-engine/debug/FileIDEngine"

      - name: Engine conformance — Rust (app-hosted adapters build)
        timeout-minutes: 15
        run: python3 "$GITHUB_WORKSPACE/shared/scripts/conformance.py" --engine "$RUNNER_TEMP/fileid-conformance-engine-apple/debug/FileIDEngine" --flavor rust --test-trash-root

      - name: Verify catalog index recovery
        run: python3 "$GITHUB_WORKSPACE/shared/scripts/check_catalog_index_jobs.py" --engine "$RUNNER_TEMP/fileid-conformance-engine/debug/FileIDEngine"

      # The shipped layout (App Store variant, unsigned), assembled the way release.sh and testflight.sh do.
      - name: Assemble the app bundle (fileidd only)
        timeout-minutes: 45
        run: |
          set -euo pipefail
          FILEID_APP_STORE=1 FILEID_BUILD_CONFIGURATION=release bash scripts/assemble_app.sh "$RUNNER_TEMP/FileID.app" 0.0.0 1
          CONTENTS="$RUNNER_TEMP/FileID.app/Contents"
          for bin in "$CONTENTS/MacOS/FileID" "$CONTENTS/MacOS/fileidd" "$CONTENTS/Frameworks/libFileIDAppleKit.dylib"; do
            if [[ ! -e "$bin" ]]; then
              echo "::error::Missing in the bundle: $bin"
              exit 1
            fi
            echo "$bin OK ($(du -m "$bin" | cut -f1) MB)"
          done
          if [[ -e "$CONTENTS/MacOS/FileIDEngine" ]]; then
            echo "::error::A second engine binary is in the bundle; only fileidd ships."
            exit 1
          fi

      # The app-hosted engine writes IPC events to stderr; stdin EOF shuts it down.
      - name: Smoke — bundled engine startup
        run: |
          set -euo pipefail
          ENGINE="$RUNNER_TEMP/FileID.app/Contents/MacOS/fileidd"
          export HOME="$RUNNER_TEMP/smoke-home" CFFIXED_USER_HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$HOME"
          : | "$ENGINE" > engine.stdout 2> engine.stderr &
          ENGINE_PID=$!
          BUDGET=30
          for i in $(seq 1 $BUDGET); do
            if ! kill -0 $ENGINE_PID 2>/dev/null; then
              echo "Engine exited after ${i}s"
              break
            fi
            sleep 1
          done
          echo "----- engine.stderr (size $(wc -c < engine.stderr) bytes) -----"
          cat engine.stderr || true
          echo "----- end -----"
          if kill -0 $ENGINE_PID 2>/dev/null; then
            kill -9 $ENGINE_PID || true
            echo "::error::fileidd did not exit within ${BUDGET}s of stdin EOF."
            exit 1
          fi
          if ! grep -q '"ready"' engine.stderr; then
            echo "::error::engine.stderr did not contain a ready event."
            exit 1
          fi
          echo "Bundled engine startup smoke passed. ✅"

      # Fails on any https URL in platforms/apple Swift sources whose host is not allowlisted.
      # Keep the allowlist in sync with windows-engine.yml.
      - name: Privacy — source URL allowlist scan
        run: |
          set -euo pipefail
          # github.com is for SwiftPM deps in Package.swift; huggingface.co for model downloads.
          allowed=(
            "huggingface.co"
            "github.com"
            "developer.download.nvidia.com"
            "developer.nvidia.com"
            "docs.nvidia.com"
            "schemas.microsoft.com"
            "schemas.openxmlformats.org"
            "ai.google.dev"
          )
          hits=()
          while IFS= read -r line; do
            file="${line%%:*}"
            url="${line#*:}"
            host=$(echo "$url" | sed -E 's|^https?://([a-zA-Z0-9._-]+).*|\1|' | tr '[:upper:]' '[:lower:]')
            allowed_match=0
            for a in "${allowed[@]}"; do
              if [ "$host" = "$a" ]; then
                allowed_match=1
                break
              fi
            done
            if [ "$allowed_match" -eq 0 ]; then
              hits+=("$file: $url")
            fi
          done < <(find . -name '*.swift' -not -path '*/.build/*' -not -path '*/DerivedData/*' \
            -exec grep -oHE 'https?://[a-zA-Z0-9._/-]+' {} \;)
          if (( ${#hits[@]} > 0 )); then
            printf '::error::URLs found that are not on the allowlist:\n'
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          echo "All Swift source URLs are on the allowlist. ✅"

      - name: Privacy — telemetry-string scan
        run: |
          set -euo pipefail
          for bin in "$RUNNER_TEMP/FileID.app/Contents/MacOS/FileID" "$RUNNER_TEMP/FileID.app/Contents/Frameworks/libFileIDAppleKit.dylib"; do
            if [[ -n "$(otool -L "$bin" | grep -i onnxruntime || true)" || -n "$(nm -a "$bin" 2>/dev/null | grep -E 'OrtGetApiBase|OnnxRuntimeBindings' || true)" ]]; then
              echo "::error::$bin links ONNX Runtime"; exit 1
            fi
          done
          CONTENTS="$RUNNER_TEMP/FileID.app/Contents"
          python3 "$GITHUB_WORKSPACE/shared/scripts/check_binary_privacy.py" "$CONTENTS/MacOS/FileID" "$CONTENTS/MacOS/fileidd" "$CONTENTS/Frameworks/libFileIDAppleKit.dylib"
          echo "No telemetry strings detected. ✅"
