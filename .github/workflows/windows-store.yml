name: Windows Store package

on:
  pull_request:
    paths:
      - 'platforms/windows/**'
      - 'shared/scripts/check_binary_privacy.py'
      - '.github/workflows/windows-store.yml'
      - '.github/workflows/ort-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'platforms/windows/**'
      - 'shared/scripts/check_binary_privacy.py'
      - '.github/workflows/windows-store.yml'
      - '.github/workflows/ort-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ort-runtime:
    name: ONNX Runtime (no telemetry)
    uses: ./.github/workflows/ort-runtime.yml
    with:
      architectures: '["x64"]'

  package:
    name: MSIX — x64
    needs: ort-runtime
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    defaults:
      run:
        working-directory: platforms/windows
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Download the telemetry-free ONNX Runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: onnxruntime-dml-notelemetry-x64
          path: platforms/windows/build/runtime-cache/onnxruntime-1.22.0-dml-notelemetry/x64
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98'
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Build and validate reserved Store package
        run: ./build/publish-store.ps1
      - name: Preserve unsigned upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FileID-Store-x64
          path: |
            platforms/windows/dist/store/*.msix
            platforms/windows/dist/store/*.sha256
          if-no-files-found: error
          retention-days: 14
