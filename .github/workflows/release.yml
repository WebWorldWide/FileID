name: Release

# Tag-triggered CD: cut a FileID release across Windows, macOS, and Linux.
#
# If the Authenticode EV cert is configured in repository secrets (FILEID_EV_THUMBPRINT),
# Windows installers are signed; otherwise clean unsigned installers are built and published.
# Use workflow_dispatch "dry_run: true" to exercise the build path without publishing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the bundle WITHOUT publishing a release (dry-run pipeline test)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    defaults:
      run:
        working-directory: platforms/windows

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust (1.90, x64 + arm64 targets)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.90
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Install .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve signing mode
        id: mode
        shell: pwsh
        env:
          FILEID_EV_THUMBPRINT: ${{ secrets.FILEID_EV_THUMBPRINT }}
        run: |
          $dry = "${{ github.event.inputs.dry_run }}" -eq 'true'
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:FILEID_EV_THUMBPRINT)
          if ($hasCert) {
            Write-Host "EV cert present: signed release build."
            "sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "No EV cert secret configured: building unsigned bundle."
            "sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          if ($dry) {
            Write-Host "Dry run requested: skipping publish."
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Release publish enabled."
            "publish=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build signed bundle
        if: steps.mode.outputs.sign == 'true'
        shell: pwsh
        env:
          CI_RELEASE: 'true'   # publish-bundle.ps1 forbids -SkipSign/-SkipPrivacyGate when set
          FILEID_EV_THUMBPRINT: ${{ secrets.FILEID_EV_THUMBPRINT }}
        run: ./build/publish-bundle.ps1 -SignThumbprint $env:FILEID_EV_THUMBPRINT

      - name: Build unsigned bundle
        if: steps.mode.outputs.sign != 'true'
        shell: pwsh
        run: ./build/publish-bundle.ps1 -SkipSign

      - name: Verify release artifacts exist
        shell: pwsh
        run: |
          foreach ($f in @("FileIDSetup.exe", "FileID-x64.msi", "FileID-arm64.msi")) {
            $p = Join-Path "dist/installer" $f
            if (-not (Test-Path $p)) { Write-Host "::error::missing release artifact $p"; exit 1 }
          }

      - name: Verify Authenticode (signed release only)
        if: steps.mode.outputs.sign == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("FileIDSetup.exe", "FileID-x64.msi", "FileID-arm64.msi")) {
            $sig = Get-AuthenticodeSignature (Join-Path "dist/installer" $f)
            if ($sig.Status -ne 'Valid') { Write-Host "::error::$f signature status is $($sig.Status)"; exit 1 }
          }
          Write-Host "All release artifacts signed + Valid."

      - name: Enforce binary privacy gate before publication
        if: steps.mode.outputs.publish == 'true'
        shell: pwsh
        run: python ../../shared/scripts/check_binary_privacy.py dist/installer

      - name: Enforce reviewed runtime egress before publication
        if: steps.mode.outputs.publish == 'true'
        shell: pwsh
        run: python ../../shared/scripts/check_runtime_egress.py --known-blockers

      - name: Download signed/non-Windows CLI/TUI bundles
        if: steps.mode.outputs.publish == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: '*tools-*'
          merge-multiple: true
          path: release-tools

      - name: Stage release-ready assets
        if: steps.mode.outputs.publish == 'true'
        shell: pwsh
        run: |
          $stage = "dist/release-ready"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $stage -ItemType Directory -Force | Out-Null
          $assets = @(
            "dist/installer/FileIDSetup.exe",
            "dist/installer/FileID-x64.msi",
            "dist/installer/FileID-arm64.msi"
          )
          foreach ($asset in $assets) { Copy-Item -LiteralPath $asset -Destination $stage }

      - name: Upload release-ready assets
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FileID-release-ready-${{ github.run_id }}
          path: platforms/windows/dist/release-ready/*
          if-no-files-found: error
          retention-days: 1

  macos-release:
    name: Build macOS DMG release
    runs-on: macos-15
    defaults:
      run:
        working-directory: platforms/apple
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Swift toolchain info
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Create Desktop folder (safeguard)
        run: mkdir -p ~/Desktop

      - name: Build DMG
        run: bash scripts/build_dmg.sh --rebuild

      - name: Stage release-ready assets
        run: |
          mkdir -p dist/release-ready
          cp dist/FileID.dmg dist/release-ready/

      - name: Upload release-ready assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FileID-macos-release-ready-${{ github.run_id }}
          path: platforms/apple/dist/release-ready/*
          if-no-files-found: error
          retention-days: 1

  linux-release:
    name: Build Linux Flatpak release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify generated offline Cargo sources
        run: |
          set -euo pipefail
          python packaging/flatpak/generate-cargo-sources.py --check
          python packaging/flatpak/test_generate_cargo_sources.py

      - name: Install flatpak + flatpak-builder
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME 49 runtime + Rust SDK extension
        run: |
          set -euo pipefail
          flatpak install -y --user flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build the Flatpak without build-network access
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo \
            build-dir \
            packaging/flatpak/io.github.fileid.FileID.yaml

      - name: Privacy scan exact Flatpak payload
        run: |
          set -euo pipefail
          python3 shared/scripts/check_binary_privacy.py \
            build-dir/files/bin/fileid-linux \
            build-dir/files/bin/FileIDEngine

      - name: Bundle the .flatpak
        run: |
          set -euo pipefail
          flatpak build-bundle repo FileID.flatpak io.github.fileid.FileID
          sha256sum FileID.flatpak > FileID.flatpak.sha256
          sha256sum --check FileID.flatpak.sha256

      - name: Upload Flatpak release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FileID-linux-release-ready-${{ github.run_id }}
          path: |
            FileID.flatpak
            FileID.flatpak.sha256
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish release
    needs: [windows-release, macos-release, linux-release]
    if: needs.windows-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Windows release assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: FileID-release-ready-${{ github.run_id }}
          path: release-assets

      - name: Download macOS release assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: FileID-macos-release-ready-${{ github.run_id }}
          path: release-assets

      - name: Download Linux release assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: FileID-linux-release-ready-${{ github.run_id }}
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -ge 1
          tag_name="${{ github.ref_name }}"
          if [ "$tag_name" = "main" ]; then
            tag_name="v0.1.0"
          fi
          echo "Publishing release assets for $tag_name:"
          ls -la release-assets/
          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "Updating existing release $tag_name..."
            gh release upload "$tag_name" --clobber release-assets/*
          else
            echo "Creating new release $tag_name..."
            gh release create "$tag_name" \
              --title "FileID $tag_name" \
              --notes "FileID $tag_name release. See README and CHANGELOG.md for platform details." \
              release-assets/*
          fi

