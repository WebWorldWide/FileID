name: Release (Windows desktop + native tools)

# Tag-triggered CD: cut the signed Windows desktop installers plus native
# engine/CLI/TUI archives for supported Windows, macOS, and Linux architectures.
#
# Signed publishing is intentionally provider-neutral. The build script accepts
# either a local certificate-store thumbprint or a provider adapter, but this
# hosted workflow remains unsigned-validation-only until a provider-specific
# authentication step is selected (see shared/docs/WINDOWS_SIGNING.md). Tagged
# pushes build and upload clearly named unsigned CI artifacts but never publish.
#
# FIRST-RELEASE NOTE: validate this end-to-end on the first real tagged release.
# The WiX MSI + Burn bundle build and the ARM64 engine cross-compile run HERE for
# the first time (the CI workflows build the app + engine but never the
# installer), so first-release surprises — e.g. the runner needing the ARM64 MSVC
# VC tools for the aarch64 cross-compile, or WiX v4 SDK restore — are expected and
# get ironed out then. publish-bundle.ps1 fails loudly if a toolchain is missing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the bundle WITHOUT signing or publishing a release (cert-less pipeline test)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Release dependency advisory gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90'
      - name: Cache cargo-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install --locked cargo-audit --version 0.22.2
      - name: Audit every shipped Rust lockfile
        run: |
          cargo audit --file platforms/windows/src/engine/Cargo.lock
          cargo audit --file platforms/cli/Cargo.lock
          cargo audit --file platforms/tui/Cargo.lock
          cargo audit --file platforms/linux/Cargo.lock

  tools-release:
    needs: dependency-policy
    name: Native engine + CLI + TUI — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            artifact: windows-x64
            runner: windows-latest
          - label: Windows arm64
            artifact: windows-arm64
            runner: windows-11-arm
          - label: macOS arm64
            artifact: macos-arm64
            runner: macos-15
          - label: macOS x64
            artifact: macos-x64
            runner: macos-15-intel
          - label: Linux x64
            artifact: linux-x64
            runner: ubuntu-24.04
          - label: Linux arm64
            artifact: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90'

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/windows/src/engine/target
            platforms/cli/target
            platforms/tui/target
          key: release-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platforms/windows/src/engine/Cargo.lock', 'platforms/cli/Cargo.lock', 'platforms/tui/Cargo.lock') }}
          restore-keys: |
            release-tools-${{ runner.os }}-${{ runner.arch }}-

      - name: Build engine + CLI + TUI
        run: |
          cargo build --release --locked --manifest-path platforms/windows/src/engine/Cargo.toml
          cargo build --release --locked --manifest-path platforms/cli/Cargo.toml
          cargo build --release --locked --manifest-path platforms/tui/Cargo.toml

      - name: Ad-hoc sign macOS tools
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - platforms/windows/src/engine/target/release/FileIDEngine
          codesign --force --sign - platforms/cli/target/release/fileid
          codesign --force --sign - platforms/tui/target/release/fileid-tui

      - name: Package toolset + staged payload privacy scan
        run: python scripts/package-tools.py --label "${{ matrix.artifact }}"

      - name: Privacy scan (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 shared/scripts/check_binary_privacy.py \
            platforms/windows/src/engine/target/release/FileIDEngine \
            platforms/cli/target/release/fileid \
            platforms/tui/target/release/fileid-tui

      - name: Privacy scan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python shared/scripts/check_binary_privacy.py `
            platforms/windows/src/engine/target/release/FileIDEngine.exe `
            platforms/cli/target/release/fileid.exe `
            platforms/tui/target/release/fileid-tui.exe

      - name: Upload tool bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Windows archives remain CI-only until their PE payloads use the
          # protected release signer. The publication download pattern excludes them.
          name: ${{ runner.os == 'Windows' && 'unsigned-tools' || 'tools' }}-${{ matrix.artifact }}
          path: |
            dist/tools/*.zip
            dist/tools/*.tar.gz
            dist/tools/*.sha256
          if-no-files-found: error

  windows-release:
    name: Build Windows release (publication gated)
    needs: tools-release
    runs-on: windows-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    defaults:
      run:
        working-directory: platforms/windows

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Verify product version contract
        shell: pwsh
        run: ./build/verify-version.ps1

      - name: Verify tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $productVersion = (Get-Content VERSION -Raw).Trim()
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($tagVersion -ne $productVersion) {
            Write-Host "::error::Release tag v$tagVersion does not match platforms/windows/VERSION ($productVersion)."
            exit 1
          }
          Write-Host "Release version contract OK: $productVersion"

      - name: Install Rust (1.90, x64 + arm64 targets)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.90
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Install .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Resolve signing mode
        id: mode
        shell: pwsh
        run: |
          $dry = "${{ github.event.inputs.dry_run }}" -eq 'true'
          $tagValidation = "${{ github.ref }}".StartsWith('refs/tags/')
          if (-not $dry -and -not $tagValidation) {
            Write-Host "::error::Signed publishing is not provider-configured. Follow shared/docs/WINDOWS_SIGNING.md, add provider authentication, then invoke publish-bundle.ps1 with -SigningAdapter, -SignerSubject, and -SignerPublicKeySha256. A thumbprint secret alone is never sufficient on a fresh hosted runner."
            exit 1
          }
          if ($tagValidation) {
            Write-Host "::warning::Tag validation is unsigned and cannot publish. A maintainer may attach these artifacts only to a clearly labeled unsigned prerelease."
          } else {
            Write-Host "Dry-run: building unsigned; no release will be published."
          }
          "sign=false"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build unsigned bundle (dry-run only)
        if: steps.mode.outputs.sign != 'true'
        shell: pwsh
        run: ./build/publish-bundle.ps1 -SkipSign

      - name: Verify release artifacts exist
        shell: pwsh
        run: |
          foreach ($f in @("FileIDSetup.exe", "FileID-x64.msi", "FileID-arm64.msi")) {
            $p = Join-Path "dist/installer" $f
            if (-not (Test-Path $p)) { Write-Host "::error::missing release artifact $p"; exit 1 }
          }

      - name: Generate Windows artifact checksums
        shell: pwsh
        run: |
          $files = @("FileIDSetup.exe", "FileID-x64.msi", "FileID-arm64.msi")
          $lines = foreach ($file in $files) {
            $path = Join-Path "dist/installer" $file
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Set-Content "dist/installer/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/installer/SHA256SUMS.txt"

      - name: Upload unsigned dry-run artifacts
        if: steps.mode.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FileID-Windows-unsigned-${{ github.run_number }}
          path: |
            platforms/windows/dist/installer/FileIDSetup.exe
            platforms/windows/dist/installer/FileID-x64.msi
            platforms/windows/dist/installer/FileID-arm64.msi
            platforms/windows/dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify Authenticode (signed release only)
        if: steps.mode.outputs.sign == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("FileIDSetup.exe", "FileID-x64.msi", "FileID-arm64.msi")) {
            $sig = Get-AuthenticodeSignature (Join-Path "dist/installer" $f)
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
              Write-Host "::error::$f signature/timestamp validation failed: $($sig.Status)"
              exit 1
            }
          }
          Write-Host "All release artifacts signed + Valid."

      - name: Enforce Hugging Face-only runtime egress before publication
        if: steps.mode.outputs.publish == 'true'
        shell: pwsh
        run: python ../../shared/scripts/check_runtime_egress.py

      - name: Download signed/non-Windows CLI/TUI bundles
        if: steps.mode.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tools-*
          merge-multiple: true
          path: release-tools

      - name: Generate checksums for every published asset
        if: steps.mode.outputs.publish == 'true'
        shell: pwsh
        run: |
          $payloads = @(
            Get-Item "dist/installer/FileIDSetup.exe"
            Get-Item "dist/installer/FileID-x64.msi"
            Get-Item "dist/installer/FileID-arm64.msi"
          )
          $payloads += Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE/release-tools" -File
          $duplicates = $payloads | Group-Object Name | Where-Object Count -gt 1
          if ($duplicates) {
            throw "release asset names must be unique: $($duplicates.Name -join ', ')"
          }
          $lines = foreach ($file in ($payloads | Sort-Object Name)) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content "dist/installer/SHA256SUMS.txt" -Encoding ascii
          if ($lines.Count -ne $payloads.Count) { throw "checksum coverage is incomplete" }
          Get-Content "dist/installer/SHA256SUMS.txt"

      - name: Stage release-ready assets
        if: steps.mode.outputs.publish == 'true'
        shell: pwsh
        run: |
          $stage = "dist/release-ready"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $stage -ItemType Directory -Force | Out-Null
          $assets = @(
            "dist/installer/FileIDSetup.exe",
            "dist/installer/FileID-x64.msi",
            "dist/installer/FileID-arm64.msi",
            "dist/installer/SHA256SUMS.txt"
          )
          $assets += Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE/release-tools" -File |
            Select-Object -ExpandProperty FullName
          foreach ($asset in $assets) { Copy-Item -LiteralPath $asset -Destination $stage }
          $staged = Get-ChildItem -LiteralPath $stage -File
          if ($staged.Count -ne $assets.Count) { throw "release-ready stage is incomplete" }

      - name: Upload release-ready assets
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FileID-release-ready-${{ github.run_id }}
          path: platforms/windows/dist/release-ready/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish signed release
    needs: windows-release
    if: needs.windows-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release-ready assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FileID-release-ready-${{ github.run_id }}
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -ge 5
          gh release create "${{ github.ref_name }}" \
            --title "FileID ${{ github.ref_name }}" \
            --generate-notes \
            release-assets/*
