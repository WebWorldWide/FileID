name: Native tools (engine + CLI + TUI)

on:
  push:
    branches: [main]
    paths:
      - 'platforms/cli/**'
      - 'platforms/tui/**'
      - 'platforms/windows/src/engine/**'
      - 'scripts/build-tools.*'
      - 'scripts/package-tools.py'
      - 'scripts/test_package_tools.py'
      - 'platforms/windows/build/fetch-runtime-deps.ps1'
      - 'platforms/windows/build/build-ort-runtime.ps1'
      - '.github/workflows/ort-runtime.yml'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - 'rust-toolchain.toml'
      - '.github/workflows/tools.yml'
      - '.github/workflows/tools-verify.yml'
  pull_request:
    paths:
      - 'platforms/cli/**'
      - 'platforms/tui/**'
      - 'platforms/windows/src/engine/**'
      - 'scripts/build-tools.*'
      - 'scripts/package-tools.py'
      - 'scripts/test_package_tools.py'
      - 'platforms/windows/build/fetch-runtime-deps.ps1'
      - 'platforms/windows/build/build-ort-runtime.ps1'
      - '.github/workflows/ort-runtime.yml'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - 'rust-toolchain.toml'
      - '.github/workflows/tools.yml'
      - '.github/workflows/tools-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ort-runtime:
    name: ONNX Runtime (no telemetry)
    uses: ./.github/workflows/ort-runtime.yml

  verify:
    name: Native tools
    uses: ./.github/workflows/tools-verify.yml
    with:
      include: >-
        [{"label": "macOS arm64", "artifact": "macos-arm64", "runner": "macos-15"},
         {"label": "macOS x64", "artifact": "macos-x64", "runner": "macos-15-intel"},
         {"label": "Linux x64", "artifact": "linux-x64", "runner": "ubuntu-24.04"},
         {"label": "Linux arm64", "artifact": "linux-arm64", "runner": "ubuntu-24.04-arm"}]

  # Only the Windows jobs package the ONNX Runtime, so only they wait for its
  # build (about an hour per architecture when the cache is cold).
  verify-windows:
    name: Native tools
    needs: ort-runtime
    uses: ./.github/workflows/tools-verify.yml
    with:
      include: >-
        [{"label": "Windows x64", "artifact": "windows-x64", "runner": "windows-latest"},
         {"label": "Windows arm64", "artifact": "windows-arm64", "runner": "windows-11-arm"}]
