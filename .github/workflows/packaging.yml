name: Packaging (Linux — Flatpak)

# Verifies the Flatpak build. ADVISORY (continue-on-error): the GNOME 46
# rust-stable SDK extension ships a Rust older than a transitive dependency's
# manifest requires (cpufeatures 0.3.0 → "failed to parse manifest"), so the
# sandbox build fails on an SDK-toolchain limitation unrelated to our code.
# Keep it advisory — surfacing progress + uploading the bundle when it works —
# until the Flathub-offline path (cargo-sources.json + a newer rust SDK
# extension) is verified on a real box. Must not red-gate main meanwhile.
# This developer manifest grants build-only network for Cargo and the
# statically linked ONNX Runtime archive; Cargo.lock checksums every crate and
# ort-sys verifies its pinned archive SHA256, so bytes fail closed even online.

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'platforms/linux/**'
      - 'platforms/windows/src/engine/**'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - 'platforms/linux/**'
      - 'platforms/windows/src/engine/**'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Flatpak — the primary, universal channel. Installs the GNOME 46 runtime +
  # the rust-stable SDK extension (GNOME 46 is based on freedesktop-sdk 23.08),
  # then runs flatpak-builder against packaging/flatpak/. ADVISORY end to end.
  # ---------------------------------------------------------------------------
  flatpak:
    name: Flatpak (GNOME 46) — x64 [advisory]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak + flatpak-builder
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME 46 runtime + rust-stable SDK extension
        run: |
          set -euo pipefail
          flatpak install -y --user flathub \
            org.gnome.Platform//46 \
            org.gnome.Sdk//46 \
            org.freedesktop.Sdk.Extension.rust-stable//23.08

      - name: Build the Flatpak
        # --share=network is granted to the build step inside the developer
        # manifest for Cargo + ort's static archive; nothing is uploaded. The
        # shipped sandbox's network grant remains user-initiated HF downloads.
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo \
            build-dir \
            packaging/flatpak/io.github.fileid.FileID.yaml

      - name: Bundle the .flatpak (artifact)
        run: |
          set -euo pipefail
          flatpak build-bundle repo FileID.flatpak io.github.fileid.FileID
          sha256sum FileID.flatpak > FileID.flatpak.sha256
          sha256sum --check FileID.flatpak.sha256

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: fileid-flatpak
          path: |
            FileID.flatpak
            FileID.flatpak.sha256
          if-no-files-found: error
