name: Packaging (Linux — Flatpak + llama.cpp runtime)

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'platforms/linux/**'
      - 'platforms/windows/src/engine/**'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - 'platforms/linux/**'
      - 'platforms/windows/src/engine/**'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Flatpak (GNOME 49) — x64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify generated offline Cargo sources
        run: |
          set -euo pipefail
          python packaging/flatpak/generate-cargo-sources.py --check
          python packaging/flatpak/test_generate_cargo_sources.py
          python3 -I platforms/linux/build/test_llama_runtime.py

      - name: Install flatpak + flatpak-builder
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME 49 runtime + Rust SDK extension
        run: |
          set -euo pipefail
          flatpak install -y --user flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build the Flatpak without build-network access
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo \
            build-dir \
            packaging/flatpak/io.github.fileid.FileID.yaml

      - name: Privacy scan exact Flatpak payload
        run: |
          set -euo pipefail
          mapfile -d '' llama < <(find build-dir/files/lib/fileid/llama.cpp -type f \( -name llama-server -o -name '*.so*' \) -print0)
          python3 shared/scripts/check_binary_privacy.py \
            build-dir/files/bin/fileid-linux \
            build-dir/files/bin/FileIDEngine \
            "${llama[@]}"

      - name: Run the bundled llama-server inside the Flatpak runtime
        run: |
          set -euo pipefail
          manifest=packaging/flatpak/io.github.fileid.FileID.yaml
          flatpak-builder --run build-dir "$manifest" /app/lib/fileid/llama.cpp/llama-server --version
          flatpak-builder --run build-dir "$manifest" python3 -I - /app/lib/fileid/llama.cpp \
            < platforms/linux/build/probe_llama_runtime.py

      - name: Bundle the .flatpak
        run: |
          set -euo pipefail
          flatpak build-bundle repo FileID.flatpak io.github.fileid.FileID
          sha256sum FileID.flatpak > FileID.flatpak.sha256
          sha256sum --check FileID.flatpak.sha256

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fileid-flatpak
          path: |
            FileID.flatpak
            FileID.flatpak.sha256
          if-no-files-found: error

  llama-runtime:
    name: llama.cpp runtime (${{ matrix.backend }}) — x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    env:
      BACKEND: ${{ matrix.backend }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
          if [ "$BACKEND" = vulkan ]; then
            sudo apt-get install -y --no-install-recommends glslc libvulkan-dev spirv-headers mesa-vulkan-drivers
          fi

      - name: Fetch the pinned llama.cpp source archive
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 \
            -o "$RUNNER_TEMP/llama.cpp-b9254.tar.gz" \
            https://codeload.github.com/ggml-org/llama.cpp/tar.gz/e947228222147356bc7e64154d3439e142481632

      - name: Build with the shared builder (verifies the archive SHA-256)
        run: |
          set -euo pipefail
          extra=()
          if [ "$BACKEND" = vulkan ]; then extra=(--vulkan); fi
          platforms/linux/build/build-llama-runtime.sh \
            --archive "$RUNNER_TEMP/llama.cpp-b9254.tar.gz" \
            --output "$RUNNER_TEMP/llama-runtime" "${extra[@]}"

      - name: Version, checksums and outbound-HTTP refusal
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/llama-runtime/llama-server" --version
          "$RUNNER_TEMP/llama-runtime/llama-server" --list-devices
          if [ "$BACKEND" = vulkan ]; then
            GGML_VK_VISIBLE_DEVICES=0 "$RUNNER_TEMP/llama-runtime/llama-server" --list-devices | tee "$RUNNER_TEMP/devices.txt"
            grep -q '^ *Vulkan0: ' "$RUNNER_TEMP/devices.txt"
          fi
          python3 -I platforms/linux/build/probe_llama_runtime.py "$RUNNER_TEMP/llama-runtime"

      - name: Privacy scan runtime binaries
        run: |
          set -euo pipefail
          mapfile -d '' llama < <(find "$RUNNER_TEMP/llama-runtime" -type f \( -name llama-server -o -name '*.so*' \) -print0)
          python3 shared/scripts/check_binary_privacy.py "${llama[@]}"
