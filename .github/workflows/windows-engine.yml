name: Windows engine

on:
  push:
    branches: [main]
    paths:
      - 'platforms/windows/**'
      - 'shared/ipc-schema/**'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - 'shared/scripts/conformance.py'
      - 'shared/test-corpus/conformance/**'
      - '.github/workflows/windows-engine.yml'
  pull_request:
    paths:
      - 'platforms/windows/**'
      - 'shared/ipc-schema/**'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - 'shared/scripts/conformance.py'
      - 'shared/test-corpus/conformance/**'
      - '.github/workflows/windows-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Build engine — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary x64 target. windows-latest = windows-2022 as of 2026.
          - label: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false

          # ARM64 native target on GitHub's `windows-11-arm` runner.
          - label: arm64-native
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            cross: false

          # ARM64 cross-compile from x64; tests are skipped because the binaries cannot run here.
          - label: arm64-cross
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            cross: true

    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.label != 'arm64-native' && fromJSON('["self-hosted","Windows","X64","fileid-adlon"]') || matrix.runner }}

    defaults:
      run:
        working-directory: platforms/windows/src/engine

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare Adlon command paths
        if: runner.name == 'adlon-fileid-windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = & C:\Windows\py.exe -3 -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { throw "Python launcher failed" }
          $paths = @('C:\Program Files\Git\bin', (Split-Path $python.Trim()))
          foreach ($path in $paths) {
            if (-not (Test-Path $path -PathType Container)) { throw "Missing tool directory: $path" }
            $path | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Prepare Adlon ARM64 Clang
        if: runner.name == 'adlon-fileid-windows' && matrix.cross
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Install the Visual Studio C++ Clang Compiler component before ARM64 cross-builds.' }
          $candidates = @('VC\Tools\Llvm\x64\bin', 'VC\Tools\Llvm\bin') | ForEach-Object { Join-Path $installation.Trim() $_ }
          $directory = $candidates | Where-Object { Test-Path (Join-Path $_ 'clang.exe') -PathType Leaf } | Select-Object -First 1
          if (-not $directory) { throw 'Visual Studio Clang executable is missing.' }
          & (Join-Path $directory 'clang.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Clang failed to start.' }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: 1.98
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/windows/src/engine/target
          key: cargo-${{ matrix.label }}-${{ hashFiles('platforms/windows/src/engine/Cargo.lock', 'platforms/windows/src/engine/Cargo.toml') }}
          restore-keys: |
            cargo-${{ matrix.label }}-

      - name: Format check
        # rustfmt.toml disables all formatting, so this only gates if that setting is dropped.
        run: cargo fmt --all -- --check

      - name: Clippy (-D warnings, full)
        # Style-only lints are allowed in Cargo.toml [lints.clippy]; add new allows there, not as CI exceptions.
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Model integrity — every registry artifact pins a SHA256 (x64 only)
        if: matrix.label == 'x64'
        shell: pwsh
        # Supply-chain gate: a downloadable model or runtime without a pinned sha256 would load
        # unverified. Every FileEntry in registry.rs must pin one; the downloader verifies it.
        run: |
          $none = Select-String -Path "src/models/registry.rs" -Pattern 'sha256:\s*None,'
          if ($none) {
            Write-Host "::error::$(@($none).Count) registry FileEntry still has sha256: None — pin a SHA256 (the oid from the HF LFS pointer, or sha256 of the release asset) for every downloadable artifact."
            $none | ForEach-Object { Write-Host "  line $($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }
          Write-Host "Model integrity OK: every registry artifact pins a SHA256."

      - name: Cache cargo-audit + cargo-deny binaries
        if: matrix.label == 'x64'
        # Caches the compiled cargo-audit and cargo-deny (about 5 minutes each to build). Bump `v1` to refresh them.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-cargo-tools
        with:
          path: |
            ~/.cargo/bin/cargo-audit*
            ~/.cargo/bin/cargo-deny*
          key: cargo-tools-${{ runner.os }}-v1

      - name: Install cargo-audit + cargo-deny
        if: matrix.label == 'x64' && steps.cache-cargo-tools.outputs.cache-hit != 'true'
        # Skipped on cache hit.
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      - name: cargo-deny (license + advisory + dup-version + ban gate)
        if: matrix.label == 'x64'
        # Enforces deny.toml: licenses, advisories, duplicate versions and sources.
        # Reviewed RUSTSEC IDs are documented in its advisories.ignore list.
        run: cargo deny check

      - name: Cargo.lock freshness (x64 only)
        if: matrix.label == 'x64'
        shell: pwsh
        # --locked fails if Cargo.lock is stale, keeping the committed lockfile authoritative for reproducible release builds.
        run: cargo metadata --locked --format-version 1 | Out-Null

      - name: Audit dependencies (x64 only)
        if: matrix.label == 'x64'
        # Soft-warn (continue-on-error): the latest cargo-audit and a freshly fetched advisory DB
        # flag a clean Cargo.lock that local runs pass. cargo deny above is the hard advisory gate.
        # See shared/docs/DECISIONS.md 2026-05-16.
        continue-on-error: true
        run: cargo audit

      - name: Privacy — source URL allowlist scan (x64 only)
        if: matrix.label == 'x64'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        # Outbound-URL allowlist over the source (the compiled binary has too many false positives
        # from runtime strings). Egress hosts: huggingface.co (model weights), github.com (llama.cpp
        # binaries), developer.download.nvidia.com (cuDNN runtime), developer.nvidia.com (help link).
        # schemas.microsoft.com and schemas.openxmlformats.org are XML namespace identifiers, never resolved.
        # To add a host, edit the list and add a rationale entry in shared/docs/DECISIONS.md.
        run: |
          $allowedHosts = @(
            "huggingface.co",
            "github.com",
            "developer.download.nvidia.com",
            "developer.nvidia.com",
            "docs.nvidia.com",
            "ai.google.dev",
            "schemas.microsoft.com",
            "schemas.openxmlformats.org"
          )
          $sources = Get-ChildItem -Path platforms/windows/src -Recurse -File `
            -Include *.rs,*.cs,*.xaml,*.xaml.cs |
            Where-Object { $_.FullName -notmatch '\\(bin|obj|target|packages)\\' }
          # Loopback is exempt: it never leaves the machine. The local VLM server (llama-server)
          # binds an ephemeral 127.0.0.1 port and gets an http:// base URL; that is IPC, not egress.
          $loopbackHosts = @("127.0.0.1", "localhost", "0.0.0.0", "::1")
          $hits = @()
          foreach ($file in $sources) {
            $content = Get-Content -Raw $file.FullName
            if (-not $content) { continue }
            $matches = [regex]::Matches($content, 'https?://([a-zA-Z0-9._-]+)')
            foreach ($m in $matches) {
              $hostName = $m.Groups[1].Value.ToLowerInvariant()
              if ($loopbackHosts -contains $hostName) { continue }
              if ($allowedHosts -notcontains $hostName) {
                $hits += "$($file.FullName): $($m.Value)"
              }
            }
          }
          Write-Host "Source files scanned: $($sources.Count)"
          if ($hits.Count -gt 0) {
            Write-Error "URLs found that are not on the allowlist:"
            $hits | ForEach-Object { Write-Error "  $_" }
            exit 1
          }
          Write-Host "All source URLs are on the allowlist. ✅"

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test
        if: matrix.cross == false
        # --all-targets also runs the unit tests inside lib modules, not just integration tests.
        run: cargo test --target ${{ matrix.target }} --all-targets

      - name: Verify binary exists
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/FileIDEngine.exe"
          if (-not (Test-Path $exe)) { throw "Engine binary missing: $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("FileIDEngine.exe size: {0:F1} MB" -f $size)

      - name: Engine conformance
        if: matrix.cross == false
        shell: pwsh
        timeout-minutes: 15
        run: python "${{ github.workspace }}/shared/scripts/conformance.py" --engine "target/${{ matrix.target }}/release/FileIDEngine.exe"

      # Smoke: the engine emits `ready` (HardwareInfo and the chosen executionProvider) on stdout,
      # then exits cleanly on stdin EOF.
      - name: Smoke — engine startup + hardware probe
        if: matrix.cross == false
        shell: pwsh
        env:
          FILEID_DB: ${{ runner.temp }}\fileid-engine-startup-${{ github.run_id }}-${{ github.run_attempt }}.sqlite
        timeout-minutes: 1
        run: |
          $exe = "target/${{ matrix.target }}/release/FileIDEngine.exe"
          New-Item -ItemType File -Path empty-stdin.txt -Force | Out-Null
          $proc = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardInput  "empty-stdin.txt" `
            -RedirectStandardOutput "engine.stdout" `
            -RedirectStandardError  "engine.stderr" `
            -NoNewWindow
          $exited = $proc.WaitForExit(10000)
          $stdout = Get-Content "engine.stdout" -Raw -ErrorAction SilentlyContinue
          $stderr = Get-Content "engine.stderr" -Raw -ErrorAction SilentlyContinue
          Write-Host "=== engine.stdout ==="
          Write-Host ($stdout ?? "<empty>")
          Write-Host "=== engine.stderr ==="
          Write-Host ($stderr ?? "<empty>")
          Write-Host "=== end ==="
          if (-not $exited) {
            try { $proc.Kill() } catch { }
            throw "Engine did not exit within 10 s of stdin EOF."
          }
          if ([string]::IsNullOrWhiteSpace($stdout)) { throw "No stdout from engine — startup failed." }
          # Event JSON is { "t": "...", "payload": { "ready": { "_0": { ... } } } }; match the variant key.
          if (-not ($stdout -match '"ready"\s*:')) {
            Write-Error "engine.stdout did not contain a ready event"
            exit 1
          }
          if (-not ($stdout -match '"executionProvider"\s*:')) {
            Write-Error "ready event missing HardwareInfo.executionProvider"
            exit 1
          }
          Write-Host "Engine startup + EP probe smoke passed. ✅"

      # Smoke `verifyCudaPack` so a regression in probe_cuda_pack() or the `HardwareReprobed` IPC contract fails CI.
      - name: Smoke — verifyCudaPack reprobe
        if: matrix.cross == false
        shell: pwsh
        env:
          FILEID_DB: ${{ runner.temp }}\fileid-engine-cuda-probe-${{ github.run_id }}-${{ github.run_attempt }}.sqlite
        timeout-minutes: 1
        run: |
          $exe = "target/${{ matrix.target }}/release/FileIDEngine.exe"
          # One UUID-keyed command then EOF; the engine emits `hardwareReprobed` and exits.
          $cmd = '{"id":"00000000-0000-0000-0000-000000000001","payload":{"verifyCudaPack":{}}}'
          Set-Content -Path verify-stdin.txt -Value $cmd -NoNewline
          Add-Content -Path verify-stdin.txt -Value "`n"
          $proc = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardInput  "verify-stdin.txt" `
            -RedirectStandardOutput "verify.stdout" `
            -RedirectStandardError  "verify.stderr" `
            -NoNewWindow
          $exited = $proc.WaitForExit(15000)
          if (-not $exited) {
            try { $proc.Kill() } catch { }
            throw "Engine did not exit within 15 s of stdin EOF on verifyCudaPack smoke."
          }
          $stdout = Get-Content "verify.stdout" -Raw -ErrorAction SilentlyContinue
          if ([string]::IsNullOrWhiteSpace($stdout)) { throw "No stdout from engine — verifyCudaPack handler unreachable." }
          if (-not ($stdout -match '"hardwareReprobed"\s*:')) {
            Write-Error "engine.stdout did not contain a hardwareReprobed event:`n$stdout"
            exit 1
          }
          Write-Host "verifyCudaPack reprobe smoke passed. ✅"

      # The shipped binary must contain no telemetry SDK strings; a failure blocks the release.
      - name: Privacy — telemetry-string scan
        if: matrix.label != 'arm64-cross'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/FileIDEngine.exe"
          python "${{ github.workspace }}/shared/scripts/check_binary_privacy.py" $exe
