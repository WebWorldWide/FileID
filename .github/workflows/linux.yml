name: Linux (engine + CLI + TUI + GTK app)

on:
  push:
    branches: [main]
    paths:
      - 'platforms/linux/**'
      - 'platforms/cli/**'
      - 'platforms/tui/**'
      - 'platforms/windows/src/engine/**'
      - 'shared/ipc-schema/**'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - 'shared/scripts/conformance.py'
      - 'shared/test-corpus/conformance/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'platforms/linux/**'
      - 'platforms/cli/**'
      - 'platforms/tui/**'
      - 'platforms/windows/src/engine/**'
      - 'shared/ipc-schema/**'
      - 'shared/scripts/check_binary_privacy.py'
      - 'shared/scripts/test_check_binary_privacy.py'
      - 'shared/scripts/conformance.py'
      - 'shared/test-corpus/conformance/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Engine: builds and tests the shared Rust engine on Linux (its Win32 surface is cfg(windows)-gated).
  engine:
    name: Engine (cross-platform Rust) — Linux x64
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && fromJSON('["self-hosted","Linux","X64","fileid-adlon"]') || 'ubuntu-latest' }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: platforms/windows/src/engine

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: 1.98
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/windows/src/engine/target
          key: cargo-engine-linux-${{ hashFiles('platforms/windows/src/engine/Cargo.lock', 'platforms/windows/src/engine/Cargo.toml') }}
          restore-keys: |
            cargo-engine-linux-

      - name: Format check
        # rustfmt.toml sets disable_all_formatting=true, so this only gates if that changes.
        run: cargo fmt --all -- --check

      - name: Clippy (-D warnings, full)
        # pdfium-render binds libpdfium at runtime, so this compiles with no system pdfium.
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Test (lib)
        # `--lib` only: the pdf paths map an absent libpdfium to an Err instead of aborting.
        run: cargo test --lib

      - name: Engine conformance
        # Cross-engine cases need the macOS engine and skip.
        timeout-minutes: 15
        run: python3 "${{ github.workspace }}/shared/scripts/conformance.py" --engine target/release/FileIDEngine

      - name: Verify binary exists
        run: |
          set -euo pipefail
          bin="target/release/FileIDEngine"
          if [[ ! -x "$bin" ]]; then
            echo "::error::Engine binary missing: $bin"
            exit 1
          fi
          size_mb=$(du -m "$bin" | cut -f1)
          echo "$bin OK (${size_mb} MB)"

      - name: Privacy — telemetry-string scan
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/shared/scripts/check_binary_privacy.py" \
            target/release/FileIDEngine

  # CLI: its own Cargo workspace, linking the engine as a library with default-features = false (no pdfium).
  cli:
    name: CLI (fileid) — Linux x64
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && fromJSON('["self-hosted","Linux","X64","fileid-adlon"]') || 'ubuntu-latest' }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: platforms/cli

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Matches platforms/cli/rust-toolchain.toml.
          toolchain: 1.98
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/cli/target
          key: cargo-cli-linux-${{ hashFiles('platforms/cli/Cargo.lock', 'platforms/cli/Cargo.toml') }}
          restore-keys: |
            cargo-cli-linux-

      - name: Clippy (-D warnings, full)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test (smoke)
        run: cargo test

  # TUI: its own Cargo workspace, linking the engine as a library with default-features = false. Pure Rust, so no apt packages.
  tui:
    name: TUI (fileid-tui) — Linux x64
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && fromJSON('["self-hosted","Linux","X64","fileid-adlon"]') || 'ubuntu-latest' }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: platforms/tui

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Matches platforms/tui/rust-toolchain.toml.
          toolchain: 1.98
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/tui/target
          key: cargo-tui-linux-${{ hashFiles('platforms/tui/Cargo.lock', 'platforms/tui/Cargo.toml') }}
          restore-keys: |
            cargo-tui-linux-

      - name: Clippy (-D warnings, full)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test (headless — state + layout + render)
        run: cargo test

  # App: the GTK4 + libadwaita app. ubuntu-latest (24.04) ships gtk4 4.14 and libadwaita 1.5, matching the crates' v4_14 / v1_5 features.
  app:
    name: GTK4 app (fileid-linux) — Linux x64
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && fromJSON('["self-hosted","Linux","X64","fileid-adlon"]') || 'ubuntu-latest' }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: platforms/linux

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install GTK4 + libadwaita system deps
        # build-essential compiles the engine's bundled SQLite and the gtk-rs -sys crates.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            build-essential \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # The shared engine path dependency pins 1.98.
          toolchain: 1.98
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/linux/target
          key: cargo-app-linux-${{ hashFiles('platforms/linux/Cargo.lock', 'platforms/linux/src/app/Cargo.toml') }}
          restore-keys: |
            cargo-app-linux-

      - name: Build (required gate)
        run: cargo build

      - name: Clippy (-D warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Display tests (Xvfb)
        # Widget-tree tests need a display; state goes to a throwaway folder.
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data" XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
          xvfb-run -a cargo test --locked -- --ignored --exact tabs::model_catalog::tests::locations_move_to_the_top_of_settings tabs::locations::tests::the_card_fills_in_when_refresh_is_pressed shell::page_header::tests::the_breadcrumb_is_never_shortened

      - name: Verify binary exists
        run: |
          set -euo pipefail
          bin="target/debug/fileid-linux"
          if [[ ! -x "$bin" ]]; then
            echo "::error::App binary missing: $bin"
            exit 1
          fi
          size_mb=$(du -m "$bin" | cut -f1)
          echo "$bin OK (${size_mb} MB)"

      - name: Privacy — telemetry-string scan
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/shared/scripts/check_binary_privacy.py" \
            target/debug/fileid-linux
