[package]
name = "fileid-linux"
version = "0.1.1"
edition = "2021"
rust-version = "1.78"
description = "FileID — Linux GTK4 + libadwaita app. Talks to the shared Rust engine over stdio."
license = "Apache-2.0"
publish = false

[[bin]]
name = "fileid-linux"
path = "src/main.rs"

[dependencies]
# GTK4 + libadwaita Rust bindings, one release train: gtk4 0.9 / libadwaita 0.7 /
# libadwaita 1.5+, which ship on Ubuntu 24.04, Fedora 40, and Arch
# rolling. Older distros use the Flatpak.
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio  = "0.20"

# Async + IPC plumbing — the GTK app spawns the engine as a child
# process and reads NDJSON from its stdout. async_channel bridges the
# engine reader thread → GTK main context for UI updates.
async-channel = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync"] }

# IPC payloads. Reuse the engine's IpcCommand / IpcEvent types directly
# so the contract can never drift between the GTK app and the engine.
fileid-engine = { path = "../../../windows/src/engine" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite read path. There is NO file-listing IPC command — the engine is the
# single DB *writer*; the app reads file rows directly from the same WAL DB,
# mirroring macOS/Windows `ReadStore`. rusqlite is already a transitive dep via
# `fileid-engine`; declaring it directly (with `bundled`) pins the same
# libsqlite3 + FTS5 build the engine links. Justified in shared/docs/DECISIONS.md.
rusqlite = { version = "0.31", features = ["bundled"] }

# Structured local-only stderr logging. NEVER transmits.
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"

# NOTE: release profile lives at the workspace root (platforms/linux/Cargo.toml)
# — a member crate's [profile] is ignored by Cargo.

[lints.rust]
unused_imports = "warn"
dead_code      = "warn"
