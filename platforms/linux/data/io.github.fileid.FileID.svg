<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon. Brand palette: gold #FFCC00, lavender #B19BCE, cyan #A0E2EA,
     pink #F2A6C0 on near-black #1A1A1F. Scalable hicolor icon reused by every
     packaging channel. -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FFCC00"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23232B"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- Document with a folded corner -->
  <path d="M40 26 h32 l20 20 v48 a8 8 0 0 1 -8 8 H40 a8 8 0 0 1 -8 -8 V34 a8 8 0 0 1 8 -8 z"
        fill="url(#page)"/>
  <path d="M72 26 l20 20 H78 a6 6 0 0 1 -6 -6 z" fill="#E6B800"/>

  <!-- Tag punch-out -->
  <g transform="translate(64 70) rotate(45)">
    <rect x="-15" y="-9" width="22" height="18" rx="4" fill="#141418"/>
    <circle cx="-8" cy="0" r="3.2" fill="#FFCC00"/>
  </g>

  <!-- Four brand accent dots = the four tabs' palette -->
  <circle cx="46" cy="44" r="4" fill="#B19BCE"/>
  <circle cx="58" cy="44" r="4" fill="#A0E2EA"/>
  <circle cx="46" cy="56" r="4" fill="#F2A6C0"/>
  <circle cx="58" cy="56" r="4" fill="#FFCC00"/>
</svg>
