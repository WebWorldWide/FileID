# Linux workspace. Single member today (the GTK4 app); the engine lives
# at platforms/windows/src/engine/ and is referenced via path dependency
# from src/app/Cargo.toml. TODO: relocate engine to shared/engine/ so
# neither platform "owns" it (tracked in shared/docs/NEXT.md).

[workspace]
resolver = "2"
members = ["src/app"]

# Profiles must live at the workspace root (a member's [profile] is ignored).
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
