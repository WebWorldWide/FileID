# FileID TUI — cross-platform `fileid-tui` terminal front-end.
#
# Like platforms/cli, this crate lives under platforms/ but is CROSS-OS: it
# links the shared Rust engine as a library and uses only portable std +
# SQLite + a pure-Rust terminal stack (ratatui + crossterm). It builds and runs
# identically on macOS, Linux, and Windows. It is its OWN standalone Cargo
# workspace (mirroring platforms/cli), not a member of any platform workspace.
#
# Engine integration mirrors the CLI: reads and planning use the library surface
# in-process; scans spawn FileIDEngine over the canonical NDJSON IPC so the
# async/ORT lifecycle stays isolated without schema drift.

[workspace]

[package]
name = "fileid-tui"
version = "0.1.2"
edition = "2021"
rust-version = "1.90"
description = "FileID — local AI file organizer. Cross-platform terminal UI (ratatui) over the shared Rust engine."
license = "Apache-2.0"
publish = false

[[bin]]
name = "fileid-tui"
path = "src/main.rs"

[dependencies]
# Reuse the engine crate directly so the IPC/DB contract can never drift — same
# schema + migrations, same FileKind classification, same restructure rule
# cascade as the CLI and the desktop apps. `default-features = false` drops the
# engine's `pdf-analyze` (pdfium) feature — the TUI never rasterizes PDFs.
fileid-engine = { path = "../windows/src/engine", default-features = false }

# Terminal UI. ratatui (immediate-mode TUI framework) + crossterm (its default,
# pure-Rust terminal backend: raw mode, alt-screen, key events). Both are
# pure-Rust with NO system-library / C build dependency, so they keep the
# "user just downloads and runs" promise and CI builds with no extra apt
# packages. These are the only genuinely new dependencies this crate
# introduces; justified in shared/docs/DECISIONS.md.
ratatui   = "0.30"
crossterm = "0.29"

# Already an engine dependency; declaring it here at the same version means
# Cargo unifies it (no new crate in the lock graph). Used for the read SQL the
# TUI runs against connections returned by `fileid_engine::db::open_read`.
rusqlite = { version = "0.31", features = ["bundled"] }

# Same rationale as rusqlite: already in the lock graph (an engine dependency),
# so declaring it here unifies to the same version — NO new crate. Required to
# speak the engine's newline-delimited JSON IPC: serialize `ipc::IpcCommand`
# (startScan) and deserialize `ipc::IpcEvent` (scan progress / complete / error)
# using the engine's own types, so the wire contract can't drift.
serde_json = "1"

anyhow = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 16
strip         = "symbols"

[lints.rust]
unused_imports = "warn"
dead_code      = "warn"
